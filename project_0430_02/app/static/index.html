<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMS 文档生成工具 - 医疗器械质量体系文档生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 650px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 500;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-download {
            background: linear-gradient(135deg, #2e7d32 0%, #43a047 100%);
            margin-top: 12px;
        }

        .btn-download:hover {
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status.info { background: #e3f2fd; color: #1565c0; display: block; }
        .status.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .status.error { background: #ffebee; color: #c62828; display: block; }
        .status.loading { background: #fff3e0; color: #e65100; display: block; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .doc-type-desc {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        /* ========== 自定义组合框样式 ========== */
        .combo-box {
            position: relative;
            width: 100%;
        }
        .combo-input {
            width: 100%;
            padding: 12px 36px 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
            cursor: pointer;
            background: white;
        }
        .combo-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .combo-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #999;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .combo-box.open .combo-arrow {
            transform: translateY(-50%) rotate(180deg);
        }
        .combo-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            max-height: 320px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .combo-box.open .combo-dropdown {
            display: block;
        }
        .combo-group-label {
            padding: 8px 14px 4px;
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            text-transform: none;
            letter-spacing: 0;
        }
        .combo-option {
            padding: 9px 14px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: background 0.15s;
        }
        .combo-option:hover,
        .combo-option.highlighted {
            background: #f0f0ff;
            color: #4f46e5;
        }
        .combo-option.empty {
            color: #999;
            cursor: default;
            text-align: center;
            padding: 16px 14px;
        }
        .combo-option.empty:hover {
            background: transparent;
            color: #999;
        }
        .combo-custom-hint {
            padding: 8px 14px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #f0f0f0;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }

        .category-header {
            font-size: 13px;
            font-weight: 600;
            color: #667eea;
            padding: 8px 12px;
            background: #f5f3ff;
            border-radius: 6px;
            margin-top: 8px;
        }

        .doc-list {
            padding-left: 0;
            list-style: none;
        }

        .doc-list li {
            padding: 4px 0;
        }

        .progress-bar-container {
            margin-top: 10px;
            background: #e0e0e0;
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* ========== 附件上传样式 ========== */
        .upload-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #444;
            margin-bottom: 4px;
        }
        .section-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
        .section-divider {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 20px 0;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            background: #fafafa;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        .upload-icon {
            font-size: 32px;
            color: #aaa;
            font-weight: 300;
            line-height: 1;
        }
        .upload-hint {
            font-size: 13px;
            color: #666;
            margin: 8px 0 4px;
        }
        .upload-formats {
            font-size: 11px;
            color: #999;
        }
        .upload-options {
            margin-top: 8px;
        }
        .checkbox-label {
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .uploaded-files {
            margin-top: 12px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .file-item .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-item .file-name {
            font-weight: 500;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-item .file-status {
            font-size: 11px;
            color: #888;
        }
        .file-item .file-preview {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }
        .file-item .file-actions button {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
        }
        .file-item .file-actions button:hover {
            color: #e74c3c;
        }
        .file-item.status-processing {
            border-left: 3px solid #f39c12;
        }
        .file-item.status-completed {
            border-left: 3px solid #2ecc71;
        }
        .file-item.status-failed {
            border-left: 3px solid #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QMS 文档生成工具</h1>
        <p class="subtitle">医疗器械质量体系文档智能生成</p>

        <!-- 附件上传区域 -->
        <div class="upload-section">
            <div class="section-title">附件上传（可选）</div>
            <p class="section-desc">上传产品文档，系统将提取内容用于生成更精准的QMS文档</p>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">+</div>
                <p class="upload-hint">拖拽文件到此处，或点击选择</p>
                <p class="upload-formats">支持 .docx / .pdf / .txt，最大 10MB</p>
                <input type="file" id="fileInput" accept=".docx,.pdf,.txt" style="display:none" multiple>
            </div>

            <div class="upload-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="persistCheckbox" checked>
                    <span>存入知识库（可在后续生成中复用）</span>
                </label>
            </div>

            <div class="uploaded-files" id="uploadedFiles"></div>
        </div>

        <hr class="section-divider">

        <form id="docForm">
            <div class="form-group">
                <label for="docType">文档类型 <span class="required">*</span></label>
                <div class="combo-box" id="docTypeCombo">
                    <input type="text" class="combo-input" id="docType" name="docType" placeholder="选择或输入文档类型" required autocomplete="off">
                    <span class="combo-arrow">&#9662;</span>
                    <div class="combo-dropdown" id="docTypeDropdown"></div>
                </div>
                <div class="doc-type-desc" id="docTypeDesc">请选择要生成的文档类型</div>
            </div>

            <div class="form-group">
                <label for="productName">产品名称 <span class="required">*</span></label>
                <input type="text" id="productName" name="productName" placeholder="例如：胰岛素泵、有源手术器械" required>
            </div>

            <div class="form-group">
                <label for="productType">产品类型</label>
                <input type="text" id="productType" name="productType" placeholder="例如：有源医疗器械、植入器械">
            </div>

            <div class="form-group">
                <label for="productParams">产品参数/描述</label>
                <textarea id="productParams" name="productParams" placeholder="请描述产品的关键技术参数、结构组成、预期用途等特性..."></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">开始生成</button>
        </form>

        <div class="status" id="status"></div>

        <div class="footer">
            <p>基于 AI 技术自动生成符合法规的质量体系文档</p>
        </div>
    </div>

    <script>
        // ========== 附件上传逻辑 ==========
        const uploadedFileIds = [];  // 已成功上传的file_id列表
        const uploadedContents = []; // 临时文本内容(非持久化)

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadedFilesDiv = document.getElementById('uploadedFiles');

        // 点击上传区域
        uploadArea.addEventListener('click', () => fileInput.click());

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(files) {
            for (const file of files) {
                uploadFile(file);
            }
            fileInput.value = '';
        }

        async function uploadFile(file) {
            const persist = document.getElementById('persistCheckbox').checked;
            const fileId = 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

            // 显示文件卡片
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item status-processing';
            fileItem.id = 'file-' + fileId;
            fileItem.innerHTML = `
                <div class="file-info">
                    <div class="file-name">${escapeHtml(file.name)}</div>
                    <div class="file-status"><span class="spinner"></span>正在上传提取...</div>
                </div>
                <div class="file-actions">
                    <button onclick="removeFile('${fileId}')" title="移除">x</button>
                </div>
            `;
            uploadedFilesDiv.appendChild(fileItem);

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('persist', persist);

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || '上传失败');
                }

                const result = await response.json();
                const taskId = result.file_id;

                // 轮询提取状态
                pollExtractStatus(fileId, taskId);

            } catch (error) {
                updateFileItem(fileId, 'failed', null, error.message);
            }
        }

        function pollExtractStatus(localId, taskId) {
            const timer = setInterval(async () => {
                try {
                    const response = await fetch('/api/extract-status/' + taskId);
                    if (!response.ok) throw new Error('查询失败');

                    const data = await response.json();

                    if (data.status === 'completed') {
                        clearInterval(timer);
                        const preview = data.preview || '';
                        updateFileItem(localId, 'completed', preview, data.char_count + ' 字符');

                        if (data.persisted) {
                            uploadedFileIds.push(taskId);
                        }
                        // 非持久化的内容存入临时文本
                        if (!data.persisted && data.preview) {
                            uploadedContents.push(data.preview);
                        }

                    } else if (data.status === 'failed') {
                        clearInterval(timer);
                        updateFileItem(localId, 'failed', null, data.message);
                    }
                    // else: 继续轮询
                } catch (error) {
                    clearInterval(timer);
                    updateFileItem(localId, 'failed', null, '查询状态失败');
                }
            }, 1500);
        }

        function updateFileItem(localId, status, preview, message) {
            const item = document.getElementById('file-' + localId);
            if (!item) return;

            item.className = 'file-item status-' + status;
            const statusDiv = item.querySelector('.file-status');
            const fileInfo = item.querySelector('.file-info');

            if (status === 'completed') {
                statusDiv.innerHTML = '提取完成 (' + message + ')';
                if (preview) {
                    const previewDiv = document.createElement('div');
                    previewDiv.className = 'file-preview';
                    previewDiv.textContent = preview;
                    fileInfo.appendChild(previewDiv);
                }
            } else {
                statusDiv.textContent = message || '提取失败';
            }
        }

        function removeFile(localId) {
            const item = document.getElementById('file-' + localId);
            if (item) {
                item.remove();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 文档类型描述 ==========
        const docTypeDescriptions = {
            'risk_management_report': '符合ISO 14971/GB 42062的综合风险管理报告，包含概述、风险分析、评估、控制措施、剩余风险评价等完整章节',
            'risk_management_plan': '定义风险管理活动的人员职责、活动安排、评审计划和风险可接受准则',
            'fmea_analysis': '失效模式与效应分析报告，包含严重度、频度数、探测度评价和RPN计算',
            'risk_acceptance_criteria': '风险可接受准则文档，定义S/O/D等级划分和RPN阈值标准',
            'periodic_risk_evaluation': '医疗器械上市后定期风险评价报告，符合法规要求',
            'design_development_plan': '定义设计开发阶段、活动、职责和时间安排，符合ISO 13485要求',
            'design_input': '产品设计输入要求，包括性能、法规、标准要求，作为设计开发的依据',
            'design_output': '设计输出文件，包括图纸、规范、检验规程、包装规范等',
            'design_review': '设计评审记录，包括评审内容、参与人员、评审结论、整改措施',
            'design_verification': '设计验证报告，证明设计输出满足设计输入要求，包括测试数据',
            'design_validation': '设计确认报告，证明产品满足使用要求和预期用途',
            'design_change': '设计变更控制记录，包括变更评估、审批和验证，确保变更受控',
            'design_history_file': 'DHF设计历史文件，汇总所有设计开发活动记录，用于注册和核查',
            'product_spec': '医疗器械注册产品技术要求，包含型号规格、性能指标、检验方法等',
            'instruction': '医疗器械使用说明书(IFU)，指导用户正确安全使用产品',
            'sop': '标准操作规程，规范生产和质量控制流程'
        };

        let pollTimer = null;

        // ========== 自定义组合框 ==========
        const docTypeGroups = [
            {
                label: '风险管理类',
                options: [
                    { label: '风险管理报告', value: 'risk_management_report' },
                    { label: '风险管理计划', value: 'risk_management_plan' },
                    { label: 'FMEA分析报告', value: 'fmea_analysis' },
                    { label: '风险可接受准则', value: 'risk_acceptance_criteria' },
                    { label: '定期风险评价报告', value: 'periodic_risk_evaluation' }
                ]
            },
            {
                label: '设计开发类',
                options: [
                    { label: '设计和开发计划', value: 'design_development_plan' },
                    { label: '设计输入', value: 'design_input' },
                    { label: '设计输出', value: 'design_output' },
                    { label: '设计评审', value: 'design_review' },
                    { label: '设计验证', value: 'design_verification' },
                    { label: '设计确认', value: 'design_validation' },
                    { label: '设计变更', value: 'design_change' },
                    { label: '设计历史文件(DHF)', value: 'design_history_file' }
                ]
            },
            {
                label: '注册申报类',
                options: [
                    { label: '产品技术要求', value: 'product_spec' }
                ]
            },
            {
                label: '通用类',
                options: [
                    { label: '使用说明书', value: 'instruction' },
                    { label: '作业指导书', value: 'sop' }
                ]
            }
        ];

        // 文档类型中文标签到英文key的映射
        const docTypeLabelToKey = {};
        docTypeGroups.forEach(group => {
            group.options.forEach(opt => {
                docTypeLabelToKey[opt.label] = opt.value;
            });
        });

        const comboBox = document.getElementById('docTypeCombo');
        const comboInput = document.getElementById('docType');
        const comboDropdown = document.getElementById('docTypeDropdown');
        let highlightedIndex = -1;
        let filteredOptions = [];

        function getAllOptions() {
            const all = [];
            docTypeGroups.forEach(group => {
                group.options.forEach(opt => {
                    all.push(opt);
                });
            });
            return all;
        }

        function filterOptions(query) {
            const q = query.toLowerCase();
            const result = [];
            docTypeGroups.forEach(group => {
                const matched = group.options.filter(opt => opt.label.toLowerCase().includes(q));
                if (matched.length > 0) {
                    result.push({ label: group.label, options: matched });
                }
            });
            return result;
        }

        function renderDropdown(filtered) {
            comboDropdown.innerHTML = '';
            if (filtered.length === 0) {
                comboDropdown.innerHTML = '<div class="combo-option empty">按 Enter 使用自定义输入</div>';
                filteredOptions = [];
                return;
            }

            let flatIndex = 0;
            filteredOptions = [];
            filtered.forEach(group => {
                const groupLabel = document.createElement('div');
                groupLabel.className = 'combo-group-label';
                groupLabel.textContent = group.label;
                comboDropdown.appendChild(groupLabel);

                group.options.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'combo-option';
                    div.textContent = opt.label;
                    div.dataset.value = opt.value;
                    div.dataset.index = flatIndex;
                    div.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        selectOption(opt);
                    });
                    comboDropdown.appendChild(div);
                    filteredOptions.push(opt);
                    flatIndex++;
                });
            });

            comboDropdown.insertAdjacentHTML('beforeend',
                '<div class="combo-custom-hint">输入自定义类型后按 Enter 确认</div>');
        }

        function selectOption(opt) {
            comboInput.value = opt.label;
            comboBox.classList.remove('open');
            updateDocTypeDesc(opt.value);
        }

        function updateDocTypeDesc(key) {
            const desc = docTypeDescriptions[key] || '自定义文档类型 - 将使用默认模板生成';
            document.getElementById('docTypeDesc').textContent = desc;
        }

        function resolveDocType(inputValue) {
            const trimmed = inputValue.trim();
            if (docTypeLabelToKey[trimmed]) {
                return docTypeLabelToKey[trimmed];
            }
            return trimmed;
        }

        function setHighlight(index) {
            const items = comboDropdown.querySelectorAll('.combo-option:not(.empty)');
            items.forEach(item => item.classList.remove('highlighted'));
            if (index >= 0 && index < items.length) {
                items[index].classList.add('highlighted');
                items[index].scrollIntoView({ block: 'nearest' });
                highlightedIndex = index;
            } else {
                highlightedIndex = -1;
            }
        }

        function openDropdown() {
            const filtered = filterOptions(comboInput.value);
            renderDropdown(filtered);
            comboBox.classList.add('open');
            highlightedIndex = -1;
        }

        function closeDropdown() {
            comboBox.classList.remove('open');
            highlightedIndex = -1;
        }

        // Input events
        comboInput.addEventListener('focus', function() {
            openDropdown();
        });

        comboInput.addEventListener('input', function() {
            openDropdown();
            updateDocTypeDesc(resolveDocType(this.value));
        });

        comboInput.addEventListener('keydown', function(e) {
            const items = comboDropdown.querySelectorAll('.combo-option:not(.empty)');

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!comboBox.classList.contains('open')) {
                    openDropdown();
                }
                setHighlight(Math.min(highlightedIndex + 1, items.length - 1));
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!comboBox.classList.contains('open')) {
                    openDropdown();
                }
                setHighlight(Math.max(highlightedIndex - 1, -1));
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (comboBox.classList.contains('open') && highlightedIndex >= 0 && highlightedIndex < filteredOptions.length) {
                    selectOption(filteredOptions[highlightedIndex]);
                } else {
                    // Use custom input value
                    closeDropdown();
                    updateDocTypeDesc(resolveDocType(comboInput.value));
                }
            } else if (e.key === 'Escape') {
                closeDropdown();
            }
        });

        // Click outside to close
        document.addEventListener('click', function(e) {
            if (!comboBox.contains(e.target)) {
                closeDropdown();
            }
        });

        // Update description on input change (fallback)
        comboInput.addEventListener('change', function() {
            updateDocTypeDesc(resolveDocType(this.value));
        });

        // ========== 表单提交 ==========
        document.getElementById('docForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');

            // 收集附件数据
            const attachmentContent = uploadedContents.length > 0 ? uploadedContents.join('\n\n') : null;
            const fileIds = uploadedFileIds.length > 0 ? [...uploadedFileIds] : null;

            const rawDocType = document.getElementById('docType').value;
            const formData = {
                doc_type: resolveDocType(rawDocType),
                product_name: document.getElementById('productName').value,
                product_type: document.getElementById('productType').value,
                product_params: document.getElementById('productParams').value,
                file_ids: fileIds,
                attachment_content: attachmentContent
            };

            if (!formData.doc_type || !formData.product_name) {
                showStatus('请填写所有必填项', 'error');
                return;
            }

            submitBtn.disabled = true;
            showStatus('<span class="spinner"></span>正在提交生成任务...', 'loading');

            try {
                // 提交生成任务
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '提交失败');
                }

                const result = await response.json();
                const taskId = result.task_id;

                // 开始轮询任务状态
                showStatus('<span class="spinner"></span>正在生成文档，请稍候...<div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>', 'loading');
                pollStatus(taskId);

            } catch (error) {
                showStatus('提交失败: ' + error.message, 'error');
                submitBtn.disabled = false;
            }
        });

        function pollStatus(taskId) {
            if (pollTimer) clearInterval(pollTimer);

            pollTimer = setInterval(async () => {
                try {
                    const response = await fetch(`/api/status/${taskId}`);
                    if (!response.ok) throw new Error('查询状态失败');

                    const data = await response.json();

                    // 更新进度条
                    const progressBar = document.getElementById('progressBar');
                    if (progressBar) {
                        progressBar.style.width = data.progress + '%';
                    }

                    if (data.status === 'completed') {
                        clearInterval(pollTimer);
                        pollTimer = null;

                        showStatus(
                            '文档生成成功！' +
                            '<button class="btn btn-download" onclick="downloadFile(\'' + taskId + '\')">下载文档</button>',
                            'success'
                        );
                        document.getElementById('submitBtn').disabled = false;

                    } else if (data.status === 'failed') {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        showStatus(data.message, 'error');
                        document.getElementById('submitBtn').disabled = false;

                    } else {
                        // 更新状态消息
                        const progressBarHtml = '<div class="progress-bar-container"><div class="progress-bar" id="progressBar" style="width:' + data.progress + '%"></div></div>';
                        showStatus('<span class="spinner"></span>' + data.message + progressBarHtml, 'loading');
                    }

                } catch (error) {
                    // 轮询失败不立即终止，继续尝试
                    console.error('轮询状态失败:', error);
                }
            }, 2000); // 每2秒轮询一次
        }

        function downloadFile(taskId) {
            window.location.href = `/api/download/${taskId}`;
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            status.innerHTML = message;
        }
    </script>
</body>
</html>
